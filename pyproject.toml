[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-markdown"
version = "0.2.0"
description = "各種ドキュメント（Office/PDF/draw.io）を Markdown + 抽出図に変換する単機能ツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "devtools-common @ git+https://github.com/<your-org>/devtools-common.git@v0.2.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "pdfplumber>=0.11",
  "defusedxml>=0.7",
  "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]

[project.scripts]
doc2md = "doc_to_markdown.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"samples/**" = ["E501"]  # サンプル生成用の XML テンプレートは長い行をそのまま持つ

[tool.pytest.ini_options]
testpaths = ["tests"]
