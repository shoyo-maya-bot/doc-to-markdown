name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: <your-org>/.github/.github/workflows/python-ci.yml@v1
    with:
      # --via-pdf のテスト用（LibreOffice が無ければ該当テストは skip される）
      extra-apt-packages: "libreoffice-writer-nogui fonts-noto-cjk"
    secrets: inherit
