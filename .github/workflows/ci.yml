name: ci

on:
  pull_request:
  push:
    branches: [main]
  # deps-lock が GITHUB_TOKEN で入れた constraints.txt のコミットでは push の CI が動かないので、手で回せるようにする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # devtools-workspace の共通 CI（SHA 固定）. lint・Linux/Windows のテスト・セキュリティ検査をまとめて流す
    uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-ci.yml@4f21d326c527d6de1e6d34527b77e912e217115a
    with:
      # --via-pdf / --recalc / OCR のテスト用（無ければ該当テストは skip される）
      extra-apt-packages: "libreoffice-writer-nogui libreoffice-calc-nogui fonts-noto-cjk tesseract-ocr"
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}  # 必要なものだけを名前で渡す（secrets: inherit は使わない）
