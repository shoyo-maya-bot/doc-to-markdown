name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-release.yml@4f21d326c527d6de1e6d34527b77e912e217115a  # devtools-workspace の共通 CI（SHA 固定）
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}  # 必要なものだけを名前で渡す（secrets: inherit は使わない）
